[project]
name = "uss-dataset-explorer"
version = "0.1.0"
description = "Explorador Streamlit para estudar os datasets USS de satisfação do usuário."
readme = "REVIEW.md"
requires-python = ">=3.11"
dependencies = [
    "deep-translator>=1.11.4",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "streamlit>=1.36.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

